apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: stheno
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Omitted when the HPA is enabled: otherwise Helm writes replicas on every upgrade and
  # the HPA immediately writes it back, so the deployment oscillates on each release.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: stheno
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stheno
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: stheno
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Values are rendered through `tpl` so one may reference the release —
          # DATABASE_URL has to name the pgbouncer service, whose name is release-scoped.
          # Values without template syntax pass through unchanged.
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ tpl $val $ | quote }}
            {{- end }}
