{{- if .Values.edge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: proxy
          image: "{{ .Values.edge.proxy.image.repository }}:{{ .Values.edge.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.edge.proxy.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - 'test -n "$STHENO_ADMIN_DOMAIN_SUFFIX" || { echo "STHENO_ADMIN_DOMAIN_SUFFIX must be set" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: STHENO_ADMIN_DOMAIN_SUFFIX
              value: {{ required "edge.adminDomainSuffix must be configured" .Values.edge.adminDomainSuffix | quote }}
            - name: STHENO_ENGINE_UPSTREAM
              value: "{{ .Release.Name }}-service:9000"
            - name: STHENO_STOREFRONT_UPSTREAM
              value: {{ .Values.edge.storefrontUpstream | quote }}
            - name: STHENO_ADMIN_UPSTREAM
              value: {{ .Values.edge.adminUpstream | quote }}
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/caddy
              readOnly: true
      volumes:
        - name: proxy-config
          configMap:
            name: {{ .Release.Name }}-proxy
{{- end }}
