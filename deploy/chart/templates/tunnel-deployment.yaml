{{- if .Values.edge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-tunnel
    spec:
      containers:
        - name: tunnel
          image: "{{ .Values.edge.tunnel.image.repository }}:{{ .Values.edge.tunnel.image.tag }}"
          imagePullPolicy: {{ .Values.edge.tunnel.image.pullPolicy }}
          command: ["tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "edge.tunnel.tokenSecret.name is required" .Values.edge.tunnel.tokenSecret.name | quote }}
                  key: {{ required "edge.tunnel.tokenSecret.key is required" .Values.edge.tunnel.tokenSecret.key | quote }}
{{- end }}
