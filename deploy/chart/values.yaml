replicaCount: 3

image:
  repository: ghcr.io/stheno/stheno-server
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.store.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: stheno-api-tls
      hosts:
        - api.store.example.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

env:
  DATABASE_URL: "postgres://stheno:password@postgres-service:5432/stheno"
  REDIS_URL: "redis://redis-service:6379"
  PORT: "9000"
  RUST_LOG: "info,stheno=debug"
