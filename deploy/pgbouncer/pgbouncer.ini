; Local-development pooler. Deliberately the same shape as the ConfigMap in
; deploy/chart/templates/pgbouncer.yaml, so behaviour under the pooler is discovered here
; rather than in production.
;
; That parity is the whole reason this exists. Transaction pooling changes runtime
; behaviour, not just capacity — most visibly for prepared statements, which
; diesel-async/tokio-postgres uses on every query. Developing without a pooler and
; deploying with one means the first place that difference shows up is production.

[databases]
stheno = host=postgres port=5432 dbname=stheno

; Session-mode alias onto the same database, for session-scoped state transaction pooling
; cannot carry — today that is PostgresAdvisoryLockProvider, which takes a SESSION-level
; pg_try_advisory_lock and unlocks on the same connection. See the chart template for the
; full reasoning; anything using this gets no pooling at all, so keep it low-volume.
stheno_session = host=postgres port=5432 dbname=stheno pool_mode=session

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; Not a tuning knob. `stheno_db::tenant` scopes with SET LOCAL, which is only correct
; because a transaction-pooled connection drops it at COMMIT. `statement` mode breaks
; SET LOCAL outright.
pool_mode = transaction

; PgBouncer >= 1.21. Without this, transaction pooling breaks protocol-level prepared
; statements with "prepared statement does not exist".
max_prepared_statements = 200

max_client_conn = 1000
default_pool_size = 25
ignore_startup_parameters = extra_float_digits
