# One compiler for CI, the container build and local checks.
#
# CI used to install whatever `stable` was newest, so each Rust release could add clippy lints
# and fail the build with no code change (1.100's clippy flags code generated by Diesel's
# `QueryableByName` derive). Pinning makes a toolchain bump a deliberate change: bump the
# channel here, in the Dockerfile's `rust:` builder tag, and run the full clippy gate in the
# same pull request.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
