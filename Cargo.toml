# Flows & API
stheno-flows = { path = "crates/flows/stheno-flows", version = "0.1.0" }
stheno-flows-order = { path = "crates/flows/stheno-flows-order", version = "0.1.0" }
stheno-flows-platform = { path = "crates/flows/stheno-flows-platform", version = "0.1.0" }
stheno-api-core = { path = "crates/api/stheno-api-core", version = "0.1.0" }
stheno-api-store = { path = "crates/api/stheno-api-store", version = "0.1.0" }
stheno-api-admin = { path = "crates/api/stheno-api-admin", version = "0.1.0" }
stheno-api-admin-platform = { path = "crates/api/stheno-api-admin-platform", version = "0.1.0" }
stheno-api-platform = { path = "crates/api/stheno-api-platform", version = "0.1.0" }
stheno-api-router = { path = "crates/api/stheno-api-router", version = "0.1.0" }
stheno-api-auth = { path = "crates/api/stheno-api-auth", version = "0.1.0" }
stheno-connector-space = { path = "crates/connectors/stheno-connector-space", version = "0.1.0" }

# Async runtime & HTTP
tokio = { version = "1.39", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "limit", "set-header", "timeout"] }
hyper = { version = "1.4", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
futures-util = { version = "0.3", features = ["alloc", "sink", "async-await"] }
url = "2.5"

# Serialization & Validation
serde = { version = "1.0", features = ["derive"] }
# arbitrary_precision keeps numeric literals as their exact digits instead of
# parsing them into f64. Without it, money read back through the repository's
# JSON bridge loses precision (ADR-006): 12345678901234.567891 became
# 12345678901234.566.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
toml = "0.8"
garde = { version = "0.20", features = ["derive", "email", "url"] }

# Data, Money & Identifiers
rust_decimal = { version = "1.36", features = ["serde", "serde-with-str", "serde-with-arbitrary-precision"] }
rust_decimal_macros = "1.36"
ulid = { version = "1.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database & ORM
diesel = { version = "2.2", default-features = false, features = ["postgres_backend", "chrono", "serde_json", "numeric", "uuid", "r2d2", "32-column-tables", "64-column-tables"] }
diesel-async = { version = "0.5", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = { version = "2.2", default-features = false }
deadpool = "0.12"

# Auth & Security
aes-gcm = "0.10"
jsonwebtoken = "9.3"
argon2 = { version = "0.5", features = ["std"] }
scrypt = "0.11"
totp-rs = { version = "5.6", features = ["qr", "serde"] }
sha2 = "0.10"
subtle = "2.6"
hmac = "0.12"
hex = "0.4"
rand = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.25"
opentelemetry = "0.24"
opentelemetry-otlp = "0.24"

# Scheduling & Caching
croner = "2.1"
fred = { version = "9.0", features = ["transactions", "subscriber-client", "serde-json"] }

# OpenAPI & CLI
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "ulid", "serde_yaml"] }
utoipa-axum = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }

# Testing & Property Testing
proptest = "1.5"
wiremock = "0.6"
testcontainers = "0.23"
insta = { version = "1.39", features = ["json"] }

[profile.dev]
# Every integration test file links its own executable -- 239 of them here --
# and each embeds the whole dependency graph. Full debug info made the build
# cache reach 95 GB and fill the disk mid-run, which surfaces as linker errors
# rather than as "out of space".
#
# "line-tables-only" keeps file and line numbers in panic backtraces, which is
# what test failures are actually read with. It drops variable-inspection data,
# so a step debugger can still show a stack but not local values.
debug = "line-tables-only"
