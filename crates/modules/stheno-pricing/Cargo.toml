[package]
name = "stheno-pricing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
stheno-types = { workspace = true }
stheno-db = { workspace = true }
# Variants reach their prices through links.link_product_variant_price_set; resolving a
# price for a variant is a pricing question, so the join lives here rather than being
# re-implemented by each of the two callers (store catalog, cart).
stheno-links = { workspace = true }
stheno-events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rust_decimal = { workspace = true }
stheno-db = { workspace = true, features = ["testing"] }
diesel = { workspace = true }
diesel-async = { workspace = true }

# ADR-006: no floating-point arithmetic in money paths. Analytics percentages in
# this crate are the deliberate exception and carry a local allow.
[lints]
workspace = true
