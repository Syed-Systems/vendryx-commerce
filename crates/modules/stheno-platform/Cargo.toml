[package]
name = "stheno-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
stheno-types = { workspace = true }
stheno-db = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }
# Operator credentials: 32 random bytes, stored as their SHA-256. Same construction as
# `stheno-api-key`, which already hashes its secrets this way.
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
stheno-db = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
