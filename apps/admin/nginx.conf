# Replicates the vite dev-proxy in apps/admin/vite.config.mts for production:
# same-origin SDK requests, /auth + /admin forwarded to the engine, Host header
# rewritten from the tenant-picker cookie (engine resolves merchant from Host).
map $cookie_stheno_tenant_host $tenant_host {
  default $http_host;
  "~.+"    $cookie_stheno_tenant_host;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — dashboard routes are client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /auth/ {
    proxy_pass http://engine:9000;
    proxy_set_header Host $tenant_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    proxy_pass http://engine:9000;
    proxy_set_header Host $tenant_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
