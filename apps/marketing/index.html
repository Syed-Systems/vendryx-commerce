    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Stheno?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Stheno is a commerce operations system that connects storefront presentation with catalogue, inventory, guest checkout, orders, and staff operations."
            }
          },
          {
            "@type": "Question",
            "name": "Who is Stheno for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Stheno is for independent store owners, ecommerce builders who need a dependable commerce core, and developers who need explicit APIs and workflow boundaries."
            }
          },
          {
            "@type": "Question",
            "name": "Do buyers need to create an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Stheno is designed around guest checkout."
            }
          },
          {
            "@type": "Question",
            "name": "What happens after the 14-day trial?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The store moves to the Free plan. Existing products, staff records, and order data are not deleted or hidden; Free limits apply to new creation."
            }
          }
        ]
